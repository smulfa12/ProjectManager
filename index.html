<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="description" content="Project Manager — workload, project, activity member & monitoring client." />
    <title>Project Manager</title>

    <link rel="icon" href="style/assets/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="style/theme.css" />
    <link rel="stylesheet" href="style/base.css" />
    <link rel="stylesheet" href="style/layout.css" />
    <link rel="stylesheet" href="style/components.css" />
    <link rel="stylesheet" href="style/pages.css" />
  </head>
  <body class="booting">
    <aside class="sidebar" aria-label="Menu utama">
      <div class="brand">
        <img src="style/assets/icon.svg" alt="" width="32" height="32" />
        <div><b>Project Manager</b><small>Workload & Activity</small></div>
      </div>
      <nav class="nav" data-nav></nav>
      <div class="userbox" data-user></div>
    </aside>
    <div class="nav-backdrop" data-nav-backdrop></div>

    <div class="main">
      <header class="topbar">
        <button class="btn btn--icon btn--ghost" data-menu-toggle aria-label="Buka menu">☰</button>
        <b>Project Manager</b>
      </header>
      <main id="app" class="app"><div class="boot">Memuat…</div></main>
    </div>

    <script>
      /*
       * Pemulihan otomatis bila browser memakai campuran file baru & lama dari cache
       * (mis. setelah update: "xxx is not a function" / "does not provide an export").
       * Semua file JS/CSS diambil ulang dari server tanpa cache, lalu halaman dimuat ulang (sekali).
       */
      window.pmHardReload = function () {
        var urls = performance.getEntriesByType('resource')
          .map(function (r) { return r.name; })
          .filter(function (u) { return u.indexOf(location.origin) === 0 && /\.(js|css)(\?|$)/.test(u); });
        urls.push(location.origin + location.pathname);
        return Promise.all(urls.map(function (u) { return fetch(u, { cache: 'reload' }).catch(function () {}); }))
          .then(function () { location.reload(); });
      };
      window.pmShowError = function (message) {
        var app = document.getElementById('app');
        var stale = /is not a function|does not provide an export|is not defined|Cannot read properties of undefined/i.test(message);
        var key = 'pm.autoReload';
        if (stale && !sessionStorage.getItem(key)) {
          sessionStorage.setItem(key, '1');
          if (app) app.innerHTML = '<div class="boot">Memperbarui aplikasi ke versi terbaru…</div>';
          window.pmHardReload();
          return;
        }
        if (!app) return;
        app.innerHTML = '<div class="app-error"><b>⚠️ Aplikasi gagal dimuat</b><p>' + String(message).replace(/</g, '&lt;') +
          '</p><p><button class="btn btn--primary btn--sm" onclick="sessionStorage.removeItem(\'' + key + '\');pmHardReload()">↻ Perbarui & muat ulang</button></p>' +
          '<p class="small">Bila tetap muncul, kirim pesan ini ke admin.</p></div>';
      };
      // error global: tangani hanya bila halaman belum tampil, atau tanda file versi lama
      function onGlobalError(message) {
        var shown = document.querySelector('#app .view');
        if (!shown || /is not a function|does not provide an export/i.test(message)) window.pmShowError(message);
      }
      window.addEventListener('error', function (e) { onGlobalError(String(e.message || e.error || 'Error')); });
      window.addEventListener('unhandledrejection', function (e) { onGlobalError(String((e.reason && e.reason.message) || e.reason)); });
      /*
       * Cek versi: nomor versi diambil langsung dari server (tanpa cache). Bila berbeda dengan versi
       * terakhir yang dibuka di browser ini, semua file JS/CSS diambil ulang lalu halaman dimuat ulang
       * sekali — mencegah campuran file lama & baru setelah update (mis. tombol baru tidak muncul).
       */
      (function () {
        var KEY = 'pm.version';
        fetch('service/version.service.js', { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.text() : ''; })
          .then(function (t) {
            var m = /APP_VERSION\s*=\s*'([^']+)'/.exec(t);
            if (!m) return;
            var latest = m[1], seen = null;
            try { seen = localStorage.getItem(KEY); localStorage.setItem(KEY, latest); } catch (e) { return; }
            if (!seen || seen === latest) return;
            var refresh = function () {
              var app = document.getElementById('app');
              if (app) app.innerHTML = '<div class="boot">Memperbarui aplikasi ke ' + latest + '…</div>';
              window.pmHardReload();
            };
            // tunggu semua modul termuat supaya ikut diambil ulang
            if (document.readyState === 'complete') refresh(); else window.addEventListener('load', refresh);
          })
          .catch(function () {});
      })();
      // berhasil dimuat → izinkan pemulihan otomatis lagi di update berikutnya
      window.addEventListener('load', function () { setTimeout(function () { if (document.querySelector('#app .view')) sessionStorage.removeItem('pm.autoReload'); }, 3000); });
    </script>
    <script type="module" src="app.js"></script>
  </body>
</html>
